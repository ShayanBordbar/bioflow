[project]
name = "bioflow"
version = "0.1.0"
description = "Provenance-first orchestration layer for computational biology workflows and sequence models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Shayan Tabebordbar" }]
keywords = ["bioinformatics", "workflow", "orchestration", "rna-seq", "mpra"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "httpx>=0.27",
    "tenacity>=8",
    "structlog>=24",
    "jinja2>=3.1",
    "platformdirs>=4",
]

[project.optional-dependencies]
# Isolated sequence runtime (Polygraph / gReLU / PyTorch). Intentionally empty
# until the compatibility spikes settle the pins.
sequence = []
# Workflow-engine tooling (Snakemake and friends). Nextflow and container
# runtimes are external and not pip-installable.
workflows = []

[project.scripts]
bioflow = "bioflow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioflow"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# Adapters wrap third-party scientific packages that are largely untyped, so the
# strictest call- and return-site checks are relaxed at that boundary only.
[[tool.mypy.overrides]]
module = ["bioflow.adapters.*"]
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "grelu.*",
    "polygraph.*",
    "torch.*",
    "snakemake.*",
    "Bio.*",
    "pysam.*",
    "anndata.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not integration and not e2e'"
markers = [
    "unit: fast, no external processes or network",
    "contract: verifies a tool or adapter interface contract",
    "integration: requires an external tool, service, or network",
    "e2e: full end-to-end run of a capability",
    "slow: takes more than a few seconds",
]
